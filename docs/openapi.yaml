openapi: 3.0.1
info:
  title: Where We Are API
  description: |
    "Questa API fornisce funzionalità per la gestione di punti di interesse (POI) e la raccolta di statistiche sugli accessi e l'interazione degli utenti. Gli endpoint consentono di aggiungere, modificare e rimuovere POI, oltre a ottenere dati analitici aggregati per comprendere meglio il comportamento degli utenti.
      
      Qui sono riportate sia le API già sviluppate sia quelle pianificate, leggere pertanto attentamente la documentazione."
    
  license:
    name: GPL 3.0
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  version: 0.1.0

tags:
  - name: operator
    description: Operazioni relative agli operatori
  - name: poi
    description: Operazioni relative ai punti di interesse
  - name: poi-stats
    description: Statistiche e analisi sui POI
  - name: events
    description: Gestione degli eventi (Funzionalità pianificate)

paths:
  /api/authn/signup:
    post:
      tags: [operator]
      summary: Crea un operatore
      operationId: createOperator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Operator'
      responses:
        '201':
          description: Operatore creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          description: not valid

  /api/authn/login:
    post:
      tags: [operator]
      summary: Effettua il login dell'operatore
      operationId: loginOperator
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login effettuato con successo
          headers:
            Authorization:
              schema: { type: string }
        '401':
          description: Credenziali non valide

  /api/app/user:
    get:
      tags: [operator]
      summary: Ottieni il profilo dell'utente corrente
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profilo utente
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/Operator'
        '401':
          description: Anauthorized
        '404':
          description: User not found

  /api/app/pois:
    get:
      tags: [poi]
      summary: Ottiene tutti i POI
      operationId: getAllPois
      responses:
        '200':
          description: Lista di POI
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/Poi'
        '404':
          description: not found
    
    post:
      tags: [poi]
      summary: Crea un nuovo POI
      operationId: addPoi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Poi'
      responses:
        '201':
          description: POI creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poi'
        '400':
          description: not valid

    delete:
      tags: [poi]
      summary: Elimina più POI
      operationId: deletePois
      responses:
        '204':
          description: POI eliminati
        '400':
          description: Array di ID non valido o vuoto
        '404':
          description: not found

  /api/app/pois/{poiId}:
    get:
      tags: [poi]
      summary: Ottieni un POI tramite ID
      operationId: getPoiById
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dettagli del POI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poi'
        '404':
          description: POI non trovato
    
    put:
      tags: [poi]
      summary: Aggiorna un POI
      operationId: updatePoi
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
                  properties:
                    name: { type: string }
                    description: { type: string }
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: POI aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poi'
        '404':
          description: POI non trovato
        '400':
          description: not valid

  /api/app/images:
    post:
      tags: [poi]
      summary: Carica immagini per un POI
      operationId: uploadImages
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, poiId]
              properties:
                files: 
                  type: array
                  items: 
                    type: string
                    format: binary
                poiId:
                  type: string
                  description: ID of the POI to attach images to
      responses:
        '201':
          description: Images uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrls: 
                    type: array
                    items: { type: string }
        '400':
          description: No images uploaded
        '404':
          description: POI not found
        '500':
          description: Image upload failed

  /api/app/images/{imageUrl}:
    delete:
      tags: [poi]
      summary: Delete an image from a POI
      operationId: deleteImage
      parameters:
        - name: imageUrl
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Image deleted
        '404':
          description: POI not found
        '500':
          description: Failed to delete image

  # POI Export
  /api/app/download:
    get:
      tags: [poi]
      summary: Esporta POI in formato KML
      operationId: exportPoisKML
      parameters:
        - name: pois
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated list of POI IDs
      responses:
        '200':
          description: KML file with POIs
          content:
            application/vnd.google-earth.kml+xml:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="pois.kml"'
        '400':
          description: Missing 'pois' parameter
        '404':
          description: not found
        '500':
          description: Failed to generate KML

  # ENDPOINTS PER LE STATISTICHE POI 
  /api/stat/stats:
    get:
      tags: [poi-stats]
      summary: Get all POI statistics
      operationId: getAllPoiStats
      responses:
        '200':
          description: recupera tutte le statistiche dei POI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoiStats'

  /api/stat/summary:
    get:
      tags: [poi-stats]
      summary: Get statistics summary
      operationId: getStatsSummary
      responses:
        '200':
          description: Statistics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalPois: { type: integer }
                  totalVisits: { type: integer }
                  totalUpvotes: { type: integer }
                  totalDownvotes: { type: integer }

  /api/stat/bulk:
    get:
      tags: [poi-stats]
      summary: Get bulk POI statistics
      operationId: getBulkPoiStats
      responses:
        '200':
          description: Bulk POI statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoiStats'

  /api/stat/recent:
    get:
      tags: [poi-stats]
      summary: Get recent activity
      operationId: getRecentActivity
      responses:
        '200':
          description: Recent activity data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    poiId: { type: string }
                    activity: { type: string }
                    timestamp: { type: string, format: date-time }

  # POI Statistics - Specific POI
  /api/stat/poi/{poiId}:
    get:
      tags: [poi-stats]
      summary: Get statistics for a specific POI
      operationId: getPoiStats
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: POI statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoiStats'
        '404':
          description: POI not found

  # POI Analytics
  /api/stat/visits:
    get:
      tags: [poi-stats]
      summary: Get visit analytics
      operationId: getVisitAnalytics
      responses:
        '200':
          description: Visit analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalVisits: { type: integer }
                  visitsThisMonth: { type: integer }
                  dailyVisits: 
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }

  /api/stat/ratings:
    get:
      tags: [poi-stats]
      summary: Get rating analytics
      operationId: getRatingAnalytics
      responses:
        '200':
          description: Rating analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUpvotes: { type: integer }
                  totalDownvotes: { type: integer }
                  averageRating: { type: number }
                  ratingDistribution:
                    type: array
                    items:
                      type: object
                      properties:
                        poiId: { type: string }
                        upvotes: { type: integer }
                        downvotes: { type: integer }

  /api/stat/top:
    get:
      tags: [poi-stats]
      summary: Get top-performing POIs
      operationId: getTopPois
      responses:
        '200':
          description: Top POIs by various metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  mostVisited:
                    type: array
                    items:
                      type: object
                      properties:
                        poiId: { type: string }
                        visits: { type: integer }
                  highestRated:
                    type: array
                    items:
                      type: object
                      properties:
                        poiId: { type: string }
                        upvotes: { type: integer }
                        downvotes: { type: integer }

  /api/stat/compare:
    get:
      tags: [poi-stats]
      summary: Compare POI statistics
      operationId: comparePoiStats
      parameters:
        - name: poiIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: Comparison of POI statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    poiId: { type: string }
                    visits: { type: integer }
                    upvotes: { type: integer }
                    downvotes: { type: integer }

  # POI Interactions
  /api/stat/pois/like/{poiId}:
    put:
      tags: [poi-stats]
      summary: Add a like to a POI
      operationId: likePoi
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Like added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      poiId: { type: string }
                      upvotes: { type: integer }
                      downvotes: { type: integer }
        '500':
          description: Internal server error

  /api/stat/pois/unlike/{poiId}:
    put:
      tags: [poi-stats]
      summary: Add a dislike to a POI
      operationId: unlikePoi
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dislike added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      poiId: { type: string }
                      upvotes: { type: integer }
                      downvotes: { type: integer }
        '500':
          description: Internal server error

  /api/stat/pois/visit/{poiId}:
    put:
      tags: [poi-stats]
      summary: Record a visit to a POI
      operationId: recordVisit
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Visit recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      poiId: { type: string }
                      totalVisits: { type: integer }
        '500':
          description: Internal server error

  # pianificato per il futuro mon implementato
  /api/app/events:
    post:
      tags: [events]
      summary: Create event
      description: Planned feature - Not implemented
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '501':
          description: Not implemented yet

components:

  schemas:
    Operator:
      type: object
      required: [email, username, password]
      properties:
        _id:
          type: string
          readOnly: true
        email: 
          type: string
          format: email
        username: { type: string }
        password: 
          type: string
          writeOnly: true
        createdAt: 
          type: string
          format: date-time
          readOnly: true

    Poi:
      type: object
      required: [geometry, properties]
      properties:
        _id:
          type: string
          readOnly: true
        type: 
          type: string
          enum: [Feature]
          default: Feature
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: 
              type: string
              enum: [Polygon]
            coordinates: 
              type: array
              description: Array of coordinate arrays for polygon
        properties:
          type: object
          required: [name, category]
          properties:
            name: { type: string }
            description: { type: string }
            images: 
              type: array
              items: { type: string }
              description: Array of image identifiers
            osmTags: 
              type: object
              description: OSM tags (key-value pairs)
              additionalProperties: true
            category: 
              type: string
              enum: [street, place, area, other]

    PoiStats:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        poiId: 
          type: string
          description: Reference to POI ObjectId
        visits:
          type: array
          items:
            type: object
            properties:
              timestamp: 
                type: string
                format: date-time
                description: Visit timestamp, defaults to current time
        rating:
          type: object
          properties:
            upvotes: 
              type: integer 
              minimum: 0
              default: 0
            downvotes: 
              type: integer 
              minimum: 0
              default: 0
        ratingMensile:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              month: { type: integer, minimum: 1, maximum: 12 }
              upvotes: { type: integer, minimum: 0, default: 0 }
              downvotes: { type: integer, minimum: 0, default: 0 }

    Event:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        title: { type: string }
        description: { type: string }
        startDate: 
          type: string
          format: date-time
        endDate: 
          type: string
          format: date-time
        location:
          type: object
          properties:
            type: 
              type: string
              enum: [Point]
              default: Point
            coordinates: 
              type: array
              items: { type: number }
        organizer: 
          type: string
          description: "Operator ID"
        status: 
          type: string
          enum: [draft, published, canceled]
          default: draft